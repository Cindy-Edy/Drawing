<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keyzia Draw Ultimate</title>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Dynamic Manifest -->
    <link rel="manifest" id="app-manifest">

    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: rgba(43, 45, 66, 0.95);
            --accent: #00f2ea; /* Neon Cyan */
            --accent-hover: #00c2bb;
            --text-main: #edf2f4;
            --text-muted: #8d99ae;
            --border: 1px solid rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#2b2d42 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Layout --- */
        
        /* Top Header */
        .header {
            height: 50px;
            background: var(--panel-bg);
            border-bottom: var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
        }

        .logo { font-weight: 600; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
        .logo i { margin-right: 8px; }

        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            margin-left: 10px;
            cursor: pointer;
            transition: 0.2s;
            padding: 8px;
            border-radius: 6px;
        }
        .header-actions button:hover { background: rgba(255,255,255,0.1); color: var(--accent); }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar Tools */
        .sidebar {
            width: 60px;
            background: var(--panel-bg);
            border-right: var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            gap: 5px;
            overflow-y: auto;
            z-index: 90;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        
        .tool-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tool-btn.active { background: rgba(0, 242, 234, 0.15); color: var(--accent); box-shadow: 0 0 10px rgba(0, 242, 234, 0.2); }
        
        /* Tooltip hack */
        .tool-btn::after {
            content: attr(data-name);
            position: absolute;
            left: 50px;
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .tool-btn:hover::after { opacity: 1; }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2b2d42;
            overflow: hidden;
        }

        canvas {
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }

        /* Properties Panel (Right/Bottom floating) */
        .properties-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 260px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }

        .panel-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Inputs */
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .palette { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .p-dot { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }

        /* Toggle Switches */
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .toggle-label { font-size: 0.9rem; color: var(--text-main); }
        .toggle-switch {
            position: relative; width: 40px; height: 20px; background: #444; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch.active { background: var(--accent); }
        .toggle-switch.active::after { left: 22px; }

        /* Buttons in Panel */
        .btn-full {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .btn-full:hover { background: var(--accent); color: #000; }

        /* Popups */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; justify-content: center; align-items: center;
            z-index: 200;
        }
        .modal {
            background: #2b2d42; padding: 20px; border-radius: 12px;
            width: 300px; text-align: center; border: 1px solid var(--accent);
        }
        
        /* Mobile Toggle */
        .mobile-toggle { display: none; }

        @media (max-width: 768px) {
            .sidebar { width: 50px; }
            .properties-panel { 
                top: auto; bottom: 0; right: 0; left: 0; 
                width: 100%; border-radius: 15px 15px 0 0;
                transform: translateY(100%);
            }
            .properties-panel.open { transform: translateY(0); }
            .mobile-toggle { display: block; position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 150; box-shadow: 0 5px 15px rgba(0,242,234,0.4); }
        }

    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo"><i class="fas fa-layer-group"></i> KEYZIA PRO</div>
        <div class="header-actions">
            <button id="undoBtn" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i></button>
            <button id="redoBtn" title="Redo (Ctrl+Y)"><i class="fas fa-redo"></i></button>
            <button id="clearBtn" title="Bersihkan Kanvas"><i class="fas fa-trash"></i></button>
            <button id="saveBtn" title="Simpan Gambar"><i class="fas fa-download"></i></button>
        </div>
    </header>

    <div class="workspace">
        
        <!-- Sidebar Tools -->
        <div class="sidebar">
            <button class="tool-btn active" data-tool="brush" data-name="Kuas"><i class="fas fa-pencil-alt"></i></button>
            <button class="tool-btn" data-tool="neon" data-name="Neon" style="color: #00f2ea;"><i class="fas fa-bolt"></i></button>
            <button class="tool-btn" data-tool="eraser" data-name="Penghapus"><i class="fas fa-eraser"></i></button>
            <button class="tool-btn" data-tool="fill" data-name="Isi Warna"><i class="fas fa-fill-drip"></i></button>
            <div style="width: 30px; height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0;"></div>
            <button class="tool-btn" data-tool="line" data-name="Garis"><i class="fas fa-minus" style="transform: rotate(-45deg);"></i></button>
            <button class="tool-btn" data-tool="rect" data-name="Kotak"><i class="far fa-square"></i></button>
            <button class="tool-btn" data-tool="circle" data-name="Lingkaran"><i class="far fa-circle"></i></button>
            <button class="tool-btn" data-tool="text" data-name="Teks"><i class="fas fa-font"></i></button>
            <div style="width: 30px; height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0;"></div>
            <button class="tool-btn" data-tool="filter" data-name="Filter & Efek"><i class="fas fa-magic"></i></button>
        </div>

        <!-- Canvas -->
        <div class="canvas-area" id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Properties Panel -->
        <div class="properties-panel" id="propPanel">
            
            <!-- Color Section -->
            <div class="panel-group">
                <label>Warna & Palet</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="mainColor" value="#000000">
                    <span id="colorHex" style="font-size: 0.8rem; font-family: monospace;">#000000</span>
                </div>
                <div class="palette" id="quickPalette"></div>
            </div>

            <!-- Size Section -->
            <div class="panel-group">
                <div style="display: flex; justify-content: space-between;">
                    <label>Ukuran Kuas</label>
                    <span id="sizeValue" style="font-size: 0.8rem; color: var(--accent);">5px</span>
                </div>
                <input type="range" id="brushSize" min="1" max="100" value="5">
            </div>

            <!-- Advanced Toggles -->
            <div class="panel-group">
                <label>Fitur Canggih</label>
                
                <div class="toggle-row" onclick="toggleFeature('mirror')">
                    <span class="toggle-label"><i class="fas fa-arrows-alt-h"></i> Mode Cermin (Mirror)</span>
                    <div class="toggle-switch" id="toggleMirror"></div>
                </div>

                <div class="toggle-row" onclick="toggleFeature('grid')">
                    <span class="toggle-label"><i class="fas fa-border-all"></i> Tampilkan Grid</span>
                    <div class="toggle-switch" id="toggleGrid"></div>
                </div>
            </div>

            <!-- Filters (Hidden by default, shown when tool is filter) -->
            <div class="panel-group" id="filterGroup" style="display: none;">
                <label>Filter Gambar</label>
                <button class="btn-full" onclick="applyFilter('grayscale')">Hitam Putih</button>
                <button class="btn-full" onclick="applyFilter('sepia')">Efek Sepia</button>
                <button class="btn-full" onclick="applyFilter('invert')">Invert Warna</button>
            </div>
            
            <div class="panel-group">
                 <button class="btn-full" id="uploadBtn"><i class="fas fa-upload"></i> Upload Foto</button>
                 <input type="file" id="fileInput" accept="image/*" hidden>
            </div>

        </div>

        <!-- Mobile Toggle Button -->
        <div class="mobile-toggle" onclick="document.getElementById('propPanel').classList.toggle('open')">
            <i class="fas fa-sliders-h"></i>
        </div>

    </div>

    <script>
        /** KEYZIA DRAW ULTIMATE ENGINE **/
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvasContainer');

        // State Management
        const state = {
            isDrawing: false,
            tool: 'brush',
            color: '#000000',
            size: 5,
            startX: 0,
            startY: 0,
            snapshot: null, // For shapes
            history: [],
            historyStep: -1,
            isMirror: false,
            isGrid: false,
            points: [] // For smooth curves
        };

        // Initialize
        function init() {
            resizeCanvas();
            createPalette();
            saveHistory(); // Initial blank state
            setupEvents();
            
            // PWA Manifest setup
            const manifest = {
                "name": "Keyzia Draw Ultimate",
                "short_name": "KeyziaPro",
                "display": "standalone",
                "background_color": "#1e1e24",
                "theme_color": "#2b2d42",
                "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/10302/10302971.png", "sizes": "512x512", "type": "image/png" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.getElementById('app-manifest').setAttribute('href', URL.createObjectURL(blob));
        }

        function resizeCanvas() {
            // Save current content
            let tempCanvas;
            if (canvas.width > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
            }

            // Resize logic
            canvas.width = container.clientWidth - 40;
            canvas.height = container.clientHeight - 40;
            
            // Background default white
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0, canvas.width, canvas.height);

            // Restore content
            if (tempCanvas) {
                ctx.drawImage(tempCanvas, 0, 0);
            }
            
            if(state.isGrid) drawGrid();
        }

        // --- Drawing Logic ---

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDraw(e) {
            if(e.target !== canvas) return;
            e.preventDefault();
            
            const pos = getPos(e);
            state.startX = pos.x;
            state.startY = pos.y;
            state.isDrawing = true;

            // Prepare context styles
            ctx.lineWidth = state.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = state.color;
            ctx.fillStyle = state.color;
            
            // Neon Effect
            if(state.tool === 'neon') {
                ctx.shadowBlur = 15;
                ctx.shadowColor = state.color;
            } else {
                ctx.shadowBlur = 0;
            }

            if(state.tool === 'fill') {
                floodFill(Math.floor(pos.x), Math.floor(pos.y), state.color);
                state.isDrawing = false;
                saveHistory();
                return;
            }

            if(state.tool === 'text') {
                const text = prompt("Masukkan teks:", "Keyzia Art");
                if(text) {
                    ctx.font = `${state.size * 2}px Poppins`;
                    ctx.fillText(text, pos.x, pos.y);
                    saveHistory();
                }
                state.isDrawing = false;
                return;
            }

            // Snapshot for shapes
            if(['rect', 'circle', 'line'].includes(state.tool)) {
                state.snapshot = ctx.getImageData(0,0, canvas.width, canvas.height);
            } else {
                state.points = [pos];
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
        }

        function draw(e) {
            if(!state.isDrawing) return;
            e.preventDefault(); // Stop scrolling on touch
            
            const pos = getPos(e);

            if(state.tool === 'brush' || state.tool === 'eraser' || state.tool === 'neon') {
                if(state.tool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.shadowBlur = 0;
                }

                // Smooth Curve Drawing
                state.points.push(pos);
                if(state.points.length > 2) {
                    const p1 = state.points[state.points.length - 2];
                    const p2 = state.points[state.points.length - 1];
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    // Use simple lineTo for performance with mirror, or quadCurve for smoothness
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();

                    // Mirror Drawing
                    if(state.isMirror) {
                        const centerX = canvas.width / 2;
                        const mX1 = centerX + (centerX - p1.x);
                        const mY1 = p1.y;
                        const mX2 = centerX + (centerX - pos.x);
                        const mY2 = pos.y;
                        
                        ctx.beginPath();
                        ctx.moveTo(mX1, mY1);
                        ctx.lineTo(mX2, mY2);
                        ctx.stroke();
                    }
                }
            }
            // Shape Preview Logic
            else if(['rect', 'circle', 'line'].includes(state.tool)) {
                ctx.putImageData(state.snapshot, 0, 0); // Restore original
                ctx.beginPath();
                
                if(state.tool === 'line') {
                    ctx.moveTo(state.startX, state.startY);
                    ctx.lineTo(pos.x, pos.y);
                } else if(state.tool === 'rect') {
                    ctx.rect(state.startX, state.startY, pos.x - state.startX, pos.y - state.startY);
                } else if(state.tool === 'circle') {
                    const radius = Math.sqrt(Math.pow(pos.x - state.startX, 2) + Math.pow(pos.y - state.startY, 2));
                    ctx.arc(state.startX, state.startY, radius, 0, 2 * Math.PI);
                }
                
                // Draw outline only for shapes
                if (state.tool !== 'line') {
                   // Optional: fill or stroke? Let's just stroke for now
                }
                ctx.stroke();
            }
        }

        function stopDraw() {
            if(state.isDrawing) {
                state.isDrawing = false;
                state.points = [];
                ctx.beginPath(); // Close path
                saveHistory();
            }
        }

        // --- Utility Functions ---

        function createPalette() {
            const colors = ['#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#ffff00', '#00ffff', '#ff00ff', '#FFA500', '#808080'];
            const container = document.getElementById('quickPalette');
            colors.forEach(c => {
                const div = document.createElement('div');
                div.className = 'p-dot';
                div.style.backgroundColor = c;
                div.onclick = () => {
                    setColor(c);
                };
                container.appendChild(div);
            });
        }

        function setColor(c) {
            state.color = c;
            document.getElementById('mainColor').value = c;
            document.getElementById('colorHex').innerText = c;
            if(state.tool === 'eraser') setTool('brush');
        }

        function setTool(t) {
            state.tool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.tool-btn[data-tool="${t}"]`);
            if(btn) btn.classList.add('active');
            
            // Show/Hide Filter Group
            document.getElementById('filterGroup').style.display = (t === 'filter') ? 'block' : 'none';
        }

        function toggleFeature(feat) {
            if(feat === 'mirror') {
                state.isMirror = !state.isMirror;
                document.getElementById('toggleMirror').classList.toggle('active');
                // Draw guide line temporarily?
                if(state.isMirror) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(0, 242, 234, 0.3)';
                    ctx.moveTo(canvas.width/2, 0);
                    ctx.lineTo(canvas.width/2, canvas.height);
                    ctx.stroke();
                    ctx.restore();
                    setTimeout(() => {
                        // A cheap refresh to remove guide line would be undo/redo, but lets assume user draws over it or undoes it
                        // Ideally: draw guide on a separate overlay canvas. For now, simple.
                        undo(); // Hacky remove line if nothing drawn
                        redo();
                    }, 500);
                }
            } else if (feat === 'grid') {
                state.isGrid = !state.isGrid;
                document.getElementById('toggleGrid').classList.toggle('active');
                if(state.isGrid) drawGrid();
                else {
                    // Force refresh from history to clear grid
                    const img = new Image();
                    img.src = state.history[state.historyStep];
                    img.onload = () => {
                        ctx.clearRect(0,0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                    };
                }
            }
        }

        function drawGrid() {
            if(!state.isGrid) return;
            const gridSize = 40;
            ctx.save();
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<=canvas.width; x+=gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for(let y=0; y<=canvas.height; y+=gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function applyFilter(type) {
            const imageData = ctx.getImageData(0,0,canvas.width, canvas.height);
            const data = imageData.data;
            
            for(let i=0; i<data.length; i+=4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                if(type === 'grayscale') {
                    const avg = 0.34*r + 0.5*g + 0.16*b;
                    data[i] = avg; data[i+1] = avg; data[i+2] = avg;
                } else if(type === 'sepia') {
                    data[i] = r*0.393 + g*0.769 + b*0.189;
                    data[i+1] = r*0.349 + g*0.686 + b*0.168;
                    data[i+2] = r*0.272 + g*0.534 + b*0.131;
                } else if(type === 'invert') {
                    data[i] = 255 - r; data[i+1] = 255 - g; data[i+2] = 255 - b;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            saveHistory();
        }

        // --- History ---
        function saveHistory() {
            state.historyStep++;
            if(state.historyStep < state.history.length) state.history.length = state.historyStep;
            state.history.push(canvas.toDataURL());
            if(state.history.length > 20) { state.history.shift(); state.historyStep--; }
        }

        function undo() {
            if(state.historyStep > 0) {
                state.historyStep--;
                restoreHistory();
            }
        }

        function redo() {
            if(state.historyStep < state.history.length - 1) {
                state.historyStep++;
                restoreHistory();
            }
        }

        function restoreHistory() {
            const img = new Image();
            img.src = state.history[state.historyStep];
            img.onload = () => {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                if(state.isGrid) drawGrid();
            };
        }

        // --- Events Setup ---
        function setupEvents() {
            // Tools
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.onclick = () => setTool(btn.dataset.tool);
            });
            
            // Header Actions
            document.getElementById('undoBtn').onclick = undo;
            document.getElementById('redoBtn').onclick = redo;
            document.getElementById('clearBtn').onclick = () => {
                if(confirm("Hapus semua?")) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0,0, canvas.width, canvas.height);
                    saveHistory();
                }
            };
            document.getElementById('saveBtn').onclick = () => {
                const a = document.createElement('a');
                a.download = 'Keyzia-Art-Pro.png';
                a.href = canvas.toDataURL();
                a.click();
            };

            // Inputs
            document.getElementById('brushSize').oninput = (e) => {
                state.size = e.target.value;
                document.getElementById('sizeValue').innerText = e.target.value + 'px';
            };
            document.getElementById('mainColor').oninput = (e) => setColor(e.target.value);

            // Canvas Drawing
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseout', stopDraw);

            canvas.addEventListener('touchstart', startDraw, {passive:false});
            canvas.addEventListener('touchmove', draw, {passive:false});
            canvas.addEventListener('touchend', stopDraw);
            
            // Upload
            document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
            document.getElementById('fileInput').onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 300, 300 * (img.height/img.width)); // Simple placement
                        saveHistory();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            
            window.addEventListener('resize', () => setTimeout(resizeCanvas, 200));
        }
        
        // --- Simple Flood Fill ---
        function floodFill(x, y, fillColor) {
            // Standard BFS implementation (omitted for brevity in prompt, reusing simple efficient one)
            // Implementation provided in previous version, here simplified placeholder
            // For production, use the previous detailed floodFill function.
            // Re-pasting standard lightweight logic:
            const imageData = ctx.getImageData(0,0,canvas.width, canvas.height);
            const targetColor = getPixel(imageData, x, y);
            const fillRGB = hexToRgb(fillColor);
            if(colorMatch(targetColor, fillRGB)) return;
            
            const queue = [[x,y]];
            while(queue.length) {
                const [cx, cy] = queue.pop();
                const idx = (cy * canvas.width + cx) * 4;
                if(cx<0 || cx>=canvas.width || cy<0 || cy>=canvas.height) continue;
                if(colorMatch(getPixel(imageData, cx, cy), targetColor)) {
                    setPixel(imageData, cx, cy, fillRGB);
                    queue.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
        function hexToRgb(hex) {
            const r = parseInt(hex.substring(1,3), 16);
            const g = parseInt(hex.substring(3,5), 16);
            const b = parseInt(hex.substring(5,7), 16);
            return {r,g,b};
        }
        function getPixel(img, x, y) {
            const i = (y * img.width + x) * 4;
            return {r: img.data[i], g: img.data[i+1], b: img.data[i+2]};
        }
        function setPixel(img, x, y, c) {
            const i = (y * img.width + x) * 4;
            img.data[i] = c.r; img.data[i+1] = c.g; img.data[i+2] = c.b; img.data[i+3] = 255;
        }
        function colorMatch(c1, c2) {
            return c1.r === c2.r && c1.g === c2.g && c1.b === c2.b;
        }

        init();
    </script>
