<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Keyzia Draw X - Creative Studio</title>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Dynamic Manifest -->
    <link rel="manifest" id="app-manifest">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.15);
            --accent: #00fff2; /* Neon Cyan */
            --accent-glow: 0 0 15px rgba(0, 255, 242, 0.6);
            --text: #ffffff;
            --panel-radius: 16px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background: var(--bg-gradient);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Canvas Layer --- */
        .canvas-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        canvas {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .ui-element { pointer-events: auto; } /* Re-enable clicks for buttons */

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { 
            font-weight: 700; font-size: 1.2rem; 
            background: linear-gradient(to right, #00fff2, #0088ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 242, 0.3);
        }

        .action-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: var(--glass-border);
            border-radius: 50px;
            padding: 5px;
            display: flex;
            gap: 5px;
        }

        /* Toolbar (Bottom) */
        .toolbar-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 10px;
        }

        .main-tools {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Side Settings (Right) */
        .settings-panel {
            position: absolute;
            top: 50%; right: 20px;
            transform: translateY(-50%);
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(15px);
            border: var(--glass-border);
            border-radius: var(--panel-radius);
            padding: 20px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .settings-panel.closed { transform: translateY(-50%) translateX(300px); }

        /* Controls */
        .btn-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-icon.active { 
            background: var(--accent); 
            color: #000; 
            box-shadow: var(--accent-glow);
            transform: translateY(-2px);
        }

        /* Inputs */
        .control-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        
        input[type="range"] {
            width: 100%; height: 4px; background: #444; border-radius: 2px;
            outline: none; appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 16px; height: 16px; background: var(--accent);
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px var(--accent);
        }

        .color-preview {
            width: 100%; height: 40px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            position: relative; overflow: hidden; cursor: pointer;
        }
        input[type="color"] {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            cursor: pointer; border: none; padding: 0; margin: 0;
        }

        /* Shapes Grid */
        .shapes-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
        }
        .shape-btn {
            background: rgba(255,255,255,0.05); border: 1px solid transparent;
            border-radius: 6px; padding: 8px 0; color: #fff; cursor: pointer;
        }
        .shape-btn:hover { background: rgba(255,255,255,0.1); }
        .shape-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0, 255, 242, 0.1); }

        /* Toggles */
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .switch {
            position: relative; width: 40px; height: 20px; background: #333; border-radius: 20px; cursor: pointer;
        }
        .switch::after {
            content:''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; 
            background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .switch.active { background: var(--accent); }
        .switch.active::after { left: 22px; }

        /* Install Button */
        #pwaInstallBtn {
            background: linear-gradient(45deg, #00fff2, #0088ff);
            color: #000; border: none; padding: 8px 20px;
            border-radius: 50px; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 242, 0.3);
            display: none; font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .settings-panel {
                top: auto; bottom: 90px; right: 10px; left: 10px; width: auto;
                transform: translateY(150%);
            }
            .settings-panel.open { transform: translateY(0); }
            .toolbar-container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <!-- Canvas Logic -->
    <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Header -->
        <div class="header ui-element">
            <div class="logo"><i class="fas fa-layer-group"></i> KEYZIA X</div>
            <button id="pwaInstallBtn"><i class="fas fa-download"></i> Install</button>
            <div class="action-bar">
                <button class="btn-icon" id="undoBtn" title="Undo"><i class="fas fa-undo"></i></button>
                <button class="btn-icon" id="redoBtn" title="Redo"><i class="fas fa-redo"></i></button>
                <button class="btn-icon" id="clearBtn" title="Bersihkan"><i class="fas fa-trash-alt"></i></button>
                <button class="btn-icon" id="saveBtn" title="Simpan"><i class="fas fa-save"></i></button>
            </div>
        </div>

        <!-- Right Settings Panel -->
        <div class="settings-panel ui-element closed" id="settingsPanel">
            
            <div class="control-group">
                <label>Warna Aktif</label>
                <div class="color-preview" id="colorPreviewBox">
                    <input type="color" id="colorInput" value="#000000">
                </div>
            </div>

            <div class="control-group">
                <label>Ukuran Kuas (<span id="sizeVal">5</span>px)</label>
                <input type="range" id="sizeRange" min="1" max="100" value="5">
            </div>

            <div class="control-group">
                <label>Bentuk Kuas</label>
                <div class="shapes-grid">
                    <button class="shape-btn active" data-shape="basic"><i class="fas fa-circle"></i></button>
                    <button class="shape-btn" data-shape="square"><i class="fas fa-square"></i></button>
                    <button class="shape-btn" data-shape="star"><i class="fas fa-star"></i></button>
                    <button class="shape-btn" data-shape="heart"><i class="fas fa-heart"></i></button>
                    <button class="shape-btn" data-shape="spray"><i class="fas fa-spray-can"></i></button>
                    <button class="shape-btn" data-shape="flower"><i class="fas fa-fan"></i></button>
                    <button class="shape-btn" data-shape="leaf"><i class="fas fa-leaf"></i></button>
                    <button class="shape-btn" data-shape="diamond"><i class="fas fa-gem"></i></button>
                </div>
            </div>

            <div class="control-group">
                <div class="toggle-row" onclick="toggleOption('neon')">
                    <span><i class="fas fa-bolt" style="color:#00fff2; margin-right:5px;"></i> Efek Neon</span>
                    <div class="switch" id="sw-neon"></div>
                </div>
                <div class="toggle-row" style="margin-top:10px;" onclick="toggleOption('mirror')">
                    <span><i class="fas fa-arrows-left-right" style="margin-right:5px;"></i> Simetri Cermin</span>
                    <div class="switch" id="sw-mirror"></div>
                </div>
                <div class="toggle-row" style="margin-top:10px;" onclick="toggleOption('grid')">
                    <span><i class="fas fa-border-all" style="margin-right:5px;"></i> Tampilkan Grid</span>
                    <div class="switch" id="sw-grid"></div>
                </div>
            </div>

            <div class="control-group">
                <label>File</label>
                <button class="shape-btn" style="width:100%" id="uploadBtn"><i class="fas fa-upload"></i> Upload Gambar</button>
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>
        </div>

        <!-- Bottom Toolbar -->
        <div class="toolbar-container ui-element">
            <div class="main-tools">
                <button class="btn-icon active" data-tool="brush" title="Kuas"><i class="fas fa-pencil-alt"></i></button>
                <button class="btn-icon" data-tool="eraser" title="Penghapus"><i class="fas fa-eraser"></i></button>
                <button class="btn-icon" data-tool="fill" title="Isi Warna"><i class="fas fa-fill-drip"></i></button>
                <button class="btn-icon" data-tool="text" title="Teks"><i class="fas fa-font"></i></button>
                <div style="width:1px; background:rgba(255,255,255,0.2); height:25px; margin:0 5px;"></div>
                <button class="btn-icon" id="toggleSettings" title="Pengaturan"><i class="fas fa-sliders-h"></i></button>
            </div>
        </div>

    </div>

    <script>
        "use strict";

        // --- Core Application State ---
        const app = {
            canvas: document.getElementById('mainCanvas'),
            ctx: null,
            dpr: window.devicePixelRatio || 1,
            isDrawing: false,
            history: [],
            historyStep: -1,
            
            // Tool State
            tool: 'brush', // brush, eraser, fill, text
            color: '#000000',
            size: 5,
            brushShape: 'basic',
            
            // Advanced Features
            isNeon: false,
            isMirror: false,
            isGrid: false,
            
            lastX: 0, lastY: 0
        };

        // --- Initialization ---
        function init() {
            app.ctx = app.canvas.getContext('2d', { willReadFrequently: true });
            
            // PWA Manifest Generation
            const manifest = {
                "name": "Keyzia Draw X",
                "short_name": "KeyziaX",
                "display": "standalone",
                "background_color": "#1a1a2e",
                "theme_color": "#00fff2",
                "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/3504/3504193.png", "sizes": "512x512", "type": "image/png" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.getElementById('app-manifest').setAttribute('href', URL.createObjectURL(blob));

            resizeCanvas();
            window.addEventListener('resize', () => { setTimeout(resizeCanvas, 200); });
            
            setupEvents();
            saveHistory(); // Initial state
        }

        function resizeCanvas() {
            // Smart resize that preserves content
            const container = app.canvas.parentElement;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            if (app.canvas.width > 0) {
                tempCanvas.width = app.canvas.width;
                tempCanvas.height = app.canvas.height;
                tempCtx.drawImage(app.canvas, 0, 0);
            }

            // Set new size based on DPR
            const rect = container.getBoundingClientRect();
            app.canvas.width = Math.round(rect.width * app.dpr);
            app.canvas.height = Math.round(rect.height * app.dpr);
            app.canvas.style.width = `${rect.width}px`;
            app.canvas.style.height = `${rect.height}px`;
            
            app.ctx.scale(app.dpr, app.dpr);
            app.ctx.lineCap = 'round';
            app.ctx.lineJoin = 'round';

            // Restore content
            if (tempCanvas.width > 0) {
                app.ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
            } else {
                // Initial white background
                app.ctx.fillStyle = '#ffffff';
                app.ctx.fillRect(0, 0, rect.width, rect.height);
            }
            
            if(app.isGrid) drawGrid();
        }

        // --- Drawing Logic ---
        function getPos(e) {
            const rect = app.canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDraw(e) {
            if(e.target !== app.canvas) return;
            if(e.type.startsWith('touch')) e.preventDefault();

            const pos = getPos(e);
            
            if(app.tool === 'fill') {
                floodFill(pos.x, pos.y);
                saveHistory();
                return;
            } else if (app.tool === 'text') {
                const text = prompt("Masukkan Teks:", "Keyzia X");
                if(text) {
                    app.ctx.fillStyle = app.color;
                    app.ctx.font = `bold ${app.size * 3}px 'Outfit', sans-serif`;
                    app.ctx.fillText(text, pos.x, pos.y);
                    saveHistory();
                }
                return;
            }

            app.isDrawing = true;
            app.lastX = pos.x;
            app.lastY = pos.y;

            // Neon Setup
            if (app.isNeon && app.tool !== 'eraser') {
                app.ctx.shadowBlur = 15;
                app.ctx.shadowColor = app.color;
            } else {
                app.ctx.shadowBlur = 0;
            }

            // Instant draw for shapes/stamps
            if (app.tool === 'brush' && app.brushShape !== 'basic') {
                drawShape(pos.x, pos.y);
            } else {
                // Basic dot for regular brush
                app.ctx.beginPath();
                app.ctx.fillStyle = app.tool === 'eraser' ? '#ffffff' : app.color;
                app.ctx.arc(pos.x, pos.y, app.size / 2, 0, Math.PI * 2);
                app.ctx.fill();
            }
        }

        function moveDraw(e) {
            if(!app.isDrawing) return;
            if(e.type.startsWith('touch')) e.preventDefault();
            
            const pos = getPos(e);
            
            if(app.tool === 'brush' && app.brushShape === 'basic' || app.tool === 'eraser') {
                app.ctx.beginPath();
                app.ctx.lineWidth = app.size;
                app.ctx.strokeStyle = app.tool === 'eraser' ? '#ffffff' : app.color;
                if(app.tool === 'eraser') app.ctx.shadowBlur = 0; // Force no neon on eraser

                app.ctx.moveTo(app.lastX, app.lastY);
                // Quadratic curve for smoothness
                app.ctx.quadraticCurveTo(app.lastX, app.lastY, pos.x, pos.y); 
                app.ctx.stroke();

                // Mirror Mode
                if(app.isMirror) {
                    const w = app.canvas.width / app.dpr;
                    const mx1 = w - app.lastX;
                    const mx2 = w - pos.x;
                    app.ctx.moveTo(mx1, app.lastY);
                    app.ctx.quadraticCurveTo(mx1, app.lastY, mx2, pos.y);
                    app.ctx.stroke();
                }
            } else if (app.tool === 'brush') {
                // Continuous shapes (spray etc)
                drawShape(pos.x, pos.y);
            }

            app.lastX = pos.x;
            app.lastY = pos.y;
        }

        function endDraw(e) {
            if(app.isDrawing) {
                app.isDrawing = false;
                app.ctx.beginPath();
                saveHistory();
            }
        }

        function drawShape(x, y) {
            app.ctx.fillStyle = app.color;
            const s = app.size;
            
            const shapes = {
                square: () => app.ctx.fillRect(x - s/2, y - s/2, s, s),
                spray: () => {
                    for(let i=0; i<5; i++) {
                        const rx = (Math.random() - 0.5) * s * 2;
                        const ry = (Math.random() - 0.5) * s * 2;
                        app.ctx.fillRect(x+rx, y+ry, 1, 1);
                    }
                },
                circle: () => { app.ctx.beginPath(); app.ctx.arc(x,y, s/2, 0, Math.PI*2); app.ctx.fill(); },
                star: () => drawPoly(x, y, 5, s, s/2),
                diamond: () => drawPoly(x, y, 4, s, s/1.5),
            };

            // Custom shape logic
            if(shapes[app.brushShape]) {
                shapes[app.brushShape]();
                if(app.isMirror) {
                   const w = app.canvas.width / app.dpr;
                   const mx = w - x;
                   // Save context to flip logic if needed, but simple x flip works for pos
                   const oldX = x; x = mx;
                   shapes[app.brushShape]();
                   x = oldX; // Restore
                }
            } else {
                // Font awesome stamps fallback
                 app.ctx.font = `${s}px FontAwesome`;
                 app.ctx.textAlign = 'center';
                 app.ctx.textBaseline = 'middle';
                 const map = { heart: '\uf004', flower: '\uf1e9', leaf: '\uf06c' };
                 if(map[app.brushShape]) {
                     app.ctx.fillText(map[app.brushShape], x, y);
                     if(app.isMirror) app.ctx.fillText(map[app.brushShape], (app.canvas.width/app.dpr) - x, y);
                 }
            }
        }

        function drawPoly(x, y, p, outer, inner) {
            app.ctx.beginPath();
            for(let i=0; i<p*2; i++) {
                const r = (i%2===0) ? outer : inner;
                const a = (Math.PI * i / p);
                app.ctx.lineTo(x + r * Math.sin(a), y + r * Math.cos(a));
            }
            app.ctx.fill();
        }

        // --- Flood Fill (Optimized) ---
        function floodFill(startX, startY) {
            const w = app.canvas.width;
            const h = app.canvas.height;
            const imageData = app.ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            
            // Adjust coords to device pixels
            const px = Math.floor(startX * app.dpr);
            const py = Math.floor(startY * app.dpr);

            // Hex to RGB
            const r = parseInt(app.color.slice(1,3), 16);
            const g = parseInt(app.color.slice(3,5), 16);
            const b = parseInt(app.color.slice(5,7), 16);
            
            const startIdx = (py * w + px) * 4;
            const startR = data[startIdx], startG = data[startIdx+1], startB = data[startIdx+2];

            if (Math.abs(r-startR)<10 && Math.abs(g-startG)<10 && Math.abs(b-startB)<10) return;

            const stack = [startIdx];
            const maxIter = w * h;
            let iter = 0;

            while(stack.length && iter < maxIter) {
                iter++;
                const idx = stack.pop();
                if(data[idx] === startR && data[idx+1] === startG && data[idx+2] === startB) {
                    data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
                    // Push neighbors (Up, Down, Left, Right)
                    if((idx/4) % w !== 0) stack.push(idx - 4); 
                    if(((idx/4)+1) % w !== 0) stack.push(idx + 4);
                    if(idx >= w * 4) stack.push(idx - w * 4);
                    if(idx < data.length - w * 4) stack.push(idx + w * 4);
                }
            }
            app.ctx.putImageData(imageData, 0, 0);
        }

        // --- Events & UI ---
        function setupEvents() {
            // Mouse/Touch
            const c = app.canvas;
            c.addEventListener('mousedown', startDraw);
            c.addEventListener('mousemove', moveDraw);
            c.addEventListener('mouseup', endDraw);
            c.addEventListener('mouseout', endDraw);
            
            c.addEventListener('touchstart', startDraw, {passive: false});
            c.addEventListener('touchmove', moveDraw, {passive: false});
            c.addEventListener('touchend', endDraw);

            // Tools
            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    app.tool = btn.dataset.tool;
                    if(app.tool === 'eraser') {
                        app.canvas.style.cursor = 'cell';
                    } else {
                        app.canvas.style.cursor = 'crosshair';
                    }
                };
            });

            // Shapes
            document.querySelectorAll('.shape-btn[data-shape]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.shape-btn[data-shape]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    app.brushShape = btn.dataset.shape;
                    // Auto switch to brush
                    document.querySelector('[data-tool="brush"]').click();
                };
            });

            // Settings Toggle
            document.getElementById('toggleSettings').onclick = () => {
                const p = document.getElementById('settingsPanel');
                p.classList.toggle('closed');
                p.classList.toggle('open'); // For mobile class handling
            };

            // Inputs
            document.getElementById('colorInput').oninput = (e) => {
                app.color = e.target.value;
                document.getElementById('colorPreviewBox').style.backgroundColor = app.color;
            };
            document.getElementById('sizeRange').oninput = (e) => {
                app.size = e.target.value;
                document.getElementById('sizeVal').innerText = app.size;
            };

            // Actions
            document.getElementById('clearBtn').onclick = () => {
                if(confirm("Hapus semua?")) {
                    const w = app.canvas.width / app.dpr;
                    const h = app.canvas.height / app.dpr;
                    app.ctx.fillStyle = '#ffffff';
                    app.ctx.fillRect(0,0, w, h);
                    saveHistory();
                }
            };
            document.getElementById('undoBtn').onclick = undo;
            document.getElementById('redoBtn').onclick = redo;
            document.getElementById('saveBtn').onclick = () => {
                const a = document.createElement('a');
                a.download = `KeyziaX-${Date.now()}.png`;
                a.href = app.canvas.toDataURL();
                a.click();
            };
            
            // Upload
            document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
            document.getElementById('fileInput').onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const w = app.canvas.width / app.dpr;
                        const h = app.canvas.height / app.dpr;
                        // Fit image
                        const scale = Math.min(w/img.width, h/img.height);
                        const x = (w - img.width * scale) / 2;
                        const y = (h - img.height * scale) / 2;
                        app.ctx.drawImage(img, x, y, img.width*scale, img.height*scale);
                        saveHistory();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
        }

        // --- Toggles ---
        window.toggleOption = (opt) => {
            if(opt === 'neon') {
                app.isNeon = !app.isNeon;
                document.getElementById('sw-neon').classList.toggle('active');
            } else if (opt === 'mirror') {
                app.isMirror = !app.isMirror;
                document.getElementById('sw-mirror').classList.toggle('active');
                if(app.isMirror) drawGuide();
                else redrawCurrent(); // Remove guide
            } else if (opt === 'grid') {
                app.isGrid = !app.isGrid;
                document.getElementById('sw-grid').classList.toggle('active');
                if(app.isGrid) drawGrid();
                else redrawCurrent();
            }
        };

        function drawGrid() {
            const w = app.canvas.width / app.dpr;
            const h = app.canvas.height / app.dpr;
            app.ctx.save();
            app.ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            app.ctx.lineWidth = 1;
            app.ctx.beginPath();
            for(let x=0; x<=w; x+=30) { app.ctx.moveTo(x,0); app.ctx.lineTo(x,h); }
            for(let y=0; y<=h; y+=30) { app.ctx.moveTo(0,y); app.ctx.lineTo(w,y); }
            app.ctx.stroke();
            app.ctx.restore();
        }
        
        function drawGuide() {
             const w = app.canvas.width / app.dpr;
             app.ctx.save();
             app.ctx.strokeStyle = 'rgba(0, 255, 242, 0.5)';
             app.ctx.setLineDash([5, 5]);
             app.ctx.beginPath();
             app.ctx.moveTo(w/2, 0); app.ctx.lineTo(w/2, app.canvas.height/app.dpr);
             app.ctx.stroke();
             app.ctx.restore();
        }

        // --- History System ---
        function saveHistory() {
            app.historyStep++;
            if(app.historyStep < app.history.length) app.history.length = app.historyStep;
            app.history.push(app.canvas.toDataURL());
            // Limit to saving memory
            if(app.history.length > 20) {
                app.history.shift();
                app.historyStep--;
            }
        }
        
        function undo() {
            if(app.historyStep > 0) {
                app.historyStep--;
                restoreHistory();
            }
        }
        
        function redo() {
            if(app.historyStep < app.history.length - 1) {
                app.historyStep++;
                restoreHistory();
            }
        }
        
        function restoreHistory() {
            const img = new Image();
            img.src = app.history[app.historyStep];
            img.onload = () => {
                const w = app.canvas.width / app.dpr;
                const h = app.canvas.height / app.dpr;
                app.ctx.clearRect(0, 0, w, h);
                app.ctx.drawImage(img, 0, 0, w, h);
                if(app.isGrid) drawGrid();
                if(app.isMirror) drawGuide();
            };
        }
        
        function redrawCurrent() { restoreHistory(); }

        // --- PWA Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => console.log('SW Registered')).catch(console.error);
        }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwaInstallBtn');
            btn.style.display = 'block';
            btn.onclick = () => {
                btn.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt = null;
            };
        });

        // Start
        init();

    </script>
</body>
</html>
