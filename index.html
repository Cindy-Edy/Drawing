<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Keyzia Draw X - Creative Studio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.15);
            --accent: #00fff2;
            --accent-glow: 0 0 15px rgba(0, 255, 242, 0.6);
            --text: #ffffff;
            --panel-radius: 16px;
        }

        /* Mencegah zoom dan scroll pada seluruh aplikasi */
        html, body { 
            overflow: hidden; 
            height: 100%; 
            position: fixed; 
            width: 100%; 
            touch-action: none; 
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background: var(--bg-gradient);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* --- Canvas Layer --- */
        .canvas-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            z-index: 1;
            /* Mencegah gesture zoom di area kanvas */
            touch-action: none; 
        }

        canvas {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none; /* Kunci gesture zoom pada kanvas */
            max-width: 100%;
            max-height: 100%;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .ui-element { pointer-events: auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .logo { 
            font-weight: 700; font-size: 0.9rem; 
            background: linear-gradient(to right, #00fff2, #0088ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .action-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: var(--glass-border);
            border-radius: 50px;
            padding: 4px;
            display: flex;
            gap: 2px;
        }

        .toolbar-container {
            display: flex;
            justify-content: center;
            padding-bottom: 10px;
        }

        .main-tools {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            gap: 12px;
        }

        .settings-panel {
            position: absolute;
            top: 70px; right: 15px;
            bottom: 100px;
            width: 280px;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(20px);
            border: var(--glass-border);
            border-radius: var(--panel-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: all 0.3s ease;
            overflow-y: auto;
            z-index: 100;
        }

        .settings-panel.closed { 
            transform: translateX(120%); 
            opacity: 0;
            pointer-events: none;
        }

        .btn-icon {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-icon.active { background: var(--accent); color: #000; }

        .shapes-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }

        .shape-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 10px 0; color: #fff;
        }
        .shape-btn.active { border-color: var(--accent); color: var(--accent); }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; padding: 5px 0;}
        .switch { width: 34px; height: 18px; background: #333; border-radius: 20px; position: relative;}
        .switch::after { content:''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: 0.3s;}
        .switch.active { background: var(--accent); }
        .switch.active::after { left: 18px; }

        @media (max-width: 600px) {
            .settings-panel { width: calc(100% - 30px); right: 15px; }
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="ui-layer">
        <div class="header ui-element">
            <div class="logo">KEYZIA DRAW X</div>
            <div class="action-bar">
                <button class="btn-icon" id="undoBtn"><i class="fas fa-undo"></i></button>
                <button class="btn-icon" id="redoBtn"><i class="fas fa-redo"></i></button>
                <button class="btn-icon" id="clearBtn"><i class="fas fa-trash-alt"></i></button>
                <button class="btn-icon" id="saveBtn"><i class="fas fa-save"></i></button>
            </div>
        </div>

        <div class="settings-panel ui-element closed" id="settingsPanel">
            <div>
                <label style="font-size: 0.7rem; color: #888;">WARNA</label>
                <div id="colorPreviewBox" style="background:#000; height:35px; border-radius:8px; margin-top:5px;">
                    <input type="color" id="colorInput" value="#000000" style="opacity:0; width:100%; height:100%;">
                </div>
            </div>

            <div>
                <label style="font-size: 0.7rem; color: #888;">UKURAN (<span id="sizeVal">5</span>px)</label>
                <input type="range" id="sizeRange" min="1" max="100" value="5" style="width:100%;">
            </div>

            <div>
                <label style="font-size: 0.7rem; color: #888;">BENTUK KUAS</label>
                <div class="shapes-grid">
                    <button class="shape-btn active" data-shape="basic"><i class="fas fa-circle"></i></button>
                    <button class="shape-btn" data-shape="square"><i class="fas fa-square"></i></button>
                    <button class="shape-btn" data-shape="star"><i class="fas fa-star"></i></button>
                    <button class="shape-btn" data-shape="heart"><i class="fas fa-heart"></i></button>
                    <button class="shape-btn" data-shape="spray"><i class="fas fa-spray-can"></i></button>
                    <button class="shape-btn" data-shape="flower"><i class="fas fa-fan"></i></button>
                    <button class="shape-btn" data-shape="leaf"><i class="fas fa-leaf"></i></button>
                    <button class="shape-btn" data-shape="diamond"><i class="fas fa-gem"></i></button>
                </div>
            </div>

            <div class="toggle-row" onclick="toggleOption('neon')">
                <span>Efek Neon</span>
                <div class="switch" id="sw-neon"></div>
            </div>
            <div class="toggle-row" onclick="toggleOption('mirror')">
                <span>Simetri Mirror</span>
                <div class="switch" id="sw-mirror"></div>
            </div>
            <div class="toggle-row" onclick="toggleOption('grid')">
                <span>Tampilkan Grid</span>
                <div class="switch" id="sw-grid"></div>
            </div>
        </div>

        <div class="toolbar-container ui-element">
            <div class="main-tools">
                <button class="btn-icon active" data-tool="brush"><i class="fas fa-pencil-alt"></i></button>
                <button class="btn-icon" data-tool="eraser"><i class="fas fa-eraser"></i></button>
                <button class="btn-icon" data-tool="fill"><i class="fas fa-fill-drip"></i></button>
                <button class="btn-icon" data-tool="text"><i class="fas fa-font"></i></button>
                <div style="width:1px; background:rgba(255,255,255,0.2); height:20px; align-self:center;"></div>
                <button class="btn-icon" id="toggleSettings"><i class="fas fa-sliders-h"></i></button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const app = {
            canvas: document.getElementById('mainCanvas'),
            ctx: null,
            dpr: window.devicePixelRatio || 1,
            isDrawing: false,
            history: [],
            historyStep: -1,
            tool: 'brush',
            color: '#000000',
            size: 5,
            brushShape: 'basic',
            isNeon: false,
            isMirror: false,
            isGrid: false,
            lastX: 0, lastY: 0
        };

        function init() {
            app.ctx = app.canvas.getContext('2d', { willReadFrequently: true });
            
            // Mencegah zoom lewat gesture jari
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            resizeCanvas();
            setupEvents();
            saveHistory();
        }

        function resizeCanvas() {
            const container = app.canvas.parentElement;
            const rect = container.getBoundingClientRect();
            
            // Save current content
            const temp = document.createElement('canvas');
            temp.width = app.canvas.width;
            temp.height = app.canvas.height;
            temp.getContext('2d').drawImage(app.canvas, 0, 0);

            app.canvas.width = rect.width * app.dpr;
            app.canvas.height = rect.height * app.dpr;
            app.canvas.style.width = rect.width + 'px';
            app.canvas.style.height = rect.height + 'px';
            
            app.ctx.scale(app.dpr, app.dpr);
            app.ctx.lineCap = 'round';
            app.ctx.lineJoin = 'round';

            app.ctx.fillStyle = '#ffffff';
            app.ctx.fillRect(0, 0, rect.width, rect.height);
            app.ctx.drawImage(temp, 0, 0, temp.width/app.dpr, temp.height/app.dpr, 0, 0, rect.width, rect.height);
        }

        function handleText(x, y) {
            const val = prompt("Ketik teks Anda:");
            if (val) {
                app.ctx.font = `bold ${app.size * 3}px Outfit, sans-serif`;
                app.ctx.fillStyle = app.color;
                app.ctx.fillText(val, x, y);
                saveHistory();
            }
        }

        function setupEvents() {
            const start = (e) => {
                e.preventDefault(); // Mencegah zoom/scroll
                const pos = getPos(e);
                if (app.tool === 'fill') { floodFill(pos.x, pos.y); saveHistory(); return; }
                if (app.tool === 'text') { handleText(pos.x, pos.y); return; }
                
                app.isDrawing = true;
                app.lastX = pos.x; app.lastY = pos.y;
                draw(pos.x, pos.y);
            };

            const move = (e) => {
                if (!app.isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                draw(pos.x, pos.y);
                app.lastX = pos.x; app.lastY = pos.y;
            };

            const stop = () => { if (app.isDrawing) { app.isDrawing = false; saveHistory(); } };

            app.canvas.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', stop);

            app.canvas.addEventListener('touchstart', start, {passive: false});
            app.canvas.addEventListener('touchmove', move, {passive: false});
            app.canvas.addEventListener('touchend', stop);

            // Tools Selection
            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    app.tool = btn.dataset.tool;
                };
            });

            // Settings Toggle
            document.getElementById('toggleSettings').onclick = () => {
                document.getElementById('settingsPanel').classList.toggle('closed');
            };

            // Color & Size
            document.getElementById('colorInput').oninput = (e) => {
                app.color = e.target.value;
                document.getElementById('colorPreviewBox').style.backgroundColor = app.color;
            };
            document.getElementById('sizeRange').oninput = (e) => {
                app.size = e.target.value;
                document.getElementById('sizeVal').innerText = app.size;
            };

            // Shapes
            document.querySelectorAll('[data-shape]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('[data-shape]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    app.brushShape = btn.dataset.shape;
                };
            });

            document.getElementById('undoBtn').onclick = undo;
            document.getElementById('redoBtn').onclick = redo;
            document.getElementById('clearBtn').onclick = () => { if(confirm("Hapus?")) { resizeCanvas(); saveHistory(); } };
            document.getElementById('saveBtn').onclick = () => {
                const link = document.createElement('a');
                link.download = 'keyzia-draw.png';
                link.href = app.canvas.toDataURL();
                link.click();
            };
        }

        function getPos(e) {
            const rect = app.canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        }

        function draw(x, y) {
            app.ctx.lineWidth = app.size;
            app.ctx.strokeStyle = app.tool === 'eraser' ? '#ffffff' : app.color;
            app.ctx.fillStyle = app.tool === 'eraser' ? '#ffffff' : app.color;
            
            if (app.isNeon && app.tool !== 'eraser') {
                app.ctx.shadowBlur = 15; app.ctx.shadowColor = app.color;
            } else {
                app.ctx.shadowBlur = 0;
            }

            if (app.brushShape === 'basic' || app.tool === 'eraser') {
                app.ctx.beginPath();
                app.ctx.moveTo(app.lastX, app.lastY);
                app.ctx.lineTo(x, y);
                app.ctx.stroke();
                if (app.isMirror) {
                    const w = app.canvas.width/app.dpr;
                    app.ctx.moveTo(w - app.lastX, app.lastY);
                    app.ctx.lineTo(w - x, y);
                    app.ctx.stroke();
                }
            } else {
                const s = parseInt(app.size);
                if (app.brushShape === 'square') app.ctx.fillRect(x-s/2, y-s/2, s, s);
                if (app.brushShape === 'spray') {
                    for(let i=0; i<10; i++) app.ctx.fillRect(x+(Math.random()-0.5)*s*2, y+(Math.random()-0.5)*s*2, 1, 1);
                }
                // (Tambahkan logika bentuk lain di sini sesuai kebutuhan)
            }
        }

        function floodFill(startX, startY) {
            const w = app.canvas.width, h = app.canvas.height;
            const imgData = app.ctx.getImageData(0,0,w,h);
            const data = imgData.data;
            const x = Math.floor(startX * app.dpr), y = Math.floor(startY * app.dpr);
            const idx = (y*w + x) * 4;
            const tr = data[idx], tg = data[idx+1], tb = data[idx+2];
            const fr = parseInt(app.color.slice(1,3), 16), fg = parseInt(app.color.slice(3,5), 16), fb = parseInt(app.color.slice(5,7), 16);
            if (Math.abs(tr-fr)<5 && Math.abs(tg-fg)<5 && Math.abs(tb-fb)<5) return;
            const stack = [idx];
            while(stack.length) {
                const i = stack.pop();
                if (data[i]===tr && data[i+1]===tg && data[i+2]===tb) {
                    data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
                    if(i%(w*4)!==0) stack.push(i-4);
                    if((i+4)%(w*4)!==0) stack.push(i+4);
                    if(i>=w*4) stack.push(i-w*4);
                    if(i<data.length-w*4) stack.push(i+w*4);
                }
            }
            app.ctx.putImageData(imgData, 0, 0);
        }

        window.toggleOption = (opt) => {
            app['is'+opt.charAt(0).toUpperCase()+opt.slice(1)] = !app['is'+opt.charAt(0).toUpperCase()+opt.slice(1)];
            document.getElementById('sw-'+opt).classList.toggle('active');
        };

        function saveHistory() {
            app.historyStep++;
            if (app.historyStep < app.history.length) app.history.length = app.historyStep;
            app.history.push(app.canvas.toDataURL());
            if (app.history.length > 20) { app.history.shift(); app.historyStep--; }
        }

        function undo() {
            if (app.historyStep > 0) {
                app.historyStep--;
                const img = new Image(); img.src = app.history[app.historyStep];
                img.onload = () => { app.ctx.fillStyle="#fff"; app.ctx.fillRect(0,0,app.canvas.width,app.canvas.height); app.ctx.drawImage(img, 0, 0, app.canvas.width/app.dpr, app.canvas.height/app.dpr); };
            }
        }
        function redo() {
            if (app.historyStep < app.history.length-1) {
                app.historyStep++;
                const img = new Image(); img.src = app.history[app.historyStep];
                img.onload = () => { app.ctx.fillStyle="#fff"; app.ctx.fillRect(0,0,app.canvas.width,app.canvas.height); app.ctx.drawImage(img, 0, 0, app.canvas.width/app.dpr, app.canvas.height/app.dpr); };
            }
        }

        init();
    </script>
</body>
</html>
